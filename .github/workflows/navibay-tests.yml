name: NaviBay tests

on:
  push:
    branches: [main]
    paths: ["navibay/**", ".github/workflows/navibay-tests.yml"]
  pull_request:
    paths: ["navibay/**", ".github/workflows/navibay-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navibay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: navibay/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python test.py
